name: iot-ops-platform

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: iot_ops
      MYSQL_USER: iot_ops
      MYSQL_PASSWORD: iot_ops_dev
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/20-xxl-job.sql:ro
      - ./deploy/xxl-job/iot_ops_job.sql:/docker-entrypoint-initdb.d/30-iot-ops-job.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_dev_only --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"

  rocketmq-store-init:
    image: apache/rocketmq:5.3.2
    user: root
    command: sh -c "chown -R 3000:3000 /home/rocketmq/store"
    volumes:
      - rocketmq-store:/home/rocketmq/store

  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      namesrv:
        condition: service_started
      rocketmq-store-init:
        condition: service_completed_successfully
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-server -Xms384m -Xmx384m -Xmn192m"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    ports:
      - "10909:10909"
      - "10911:10911"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root_dev_only
        --xxl.job.accessToken=iot-ops-demo-token
    ports:
      - "8088:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      xxl-job-admin:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/iot_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: iot_ops
      DB_PASSWORD: iot_ops_dev
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: namesrv:9876
      ALARM_ROCKETMQ_ENABLED: "true"
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080
      XXL_JOB_ACCESS_TOKEN: iot-ops-demo-token
      XXL_JOB_EXECUTOR_ADDRESS: http://backend:9999
      XXL_JOB_LOG_PATH: /tmp/xxl-job
    ports:
      - "18080:8080"
      - "9999:9999"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
