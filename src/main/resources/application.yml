server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: iot-ops-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iot_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:iot_ops}
    password: ${DB_PASSWORD:iot_ops_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: X-Token
  timeout: 28800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  consumer:
    group: ${ROCKETMQ_CONSUMER_GROUP:iot-ops-alarm-consumer}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

iot-ops:
  import:
    max-rows: ${IMPORT_MAX_ROWS:10000}
    insert-batch-size: ${IMPORT_INSERT_BATCH_SIZE:200}
  alarm:
    rocketmq-enabled: ${ALARM_ROCKETMQ_ENABLED:false}
    topic: ${ALARM_TOPIC:iot-device-alarm}
  timeout:
    batch-size: ${TIMEOUT_SCAN_BATCH_SIZE:100}
  xxl-job:
    enabled: ${XXL_JOB_ENABLED:false}

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      app-name: ${XXL_JOB_EXECUTOR_APP_NAME:iot-ops-platform}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
      log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
