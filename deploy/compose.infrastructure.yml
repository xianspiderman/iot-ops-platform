services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: iot_ops
      MYSQL_USER: iot_ops
      MYSQL_PASSWORD: iot_ops_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - iot-ops-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.2.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - iot-ops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  iot-ops-mysql:
  iot-ops-redis:
